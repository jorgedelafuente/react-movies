allowBuilds:
  '@swc/core': true
  esbuild: true
  msw: true
minimumReleaseAgeExclude:
  - fast-uri@4.1.4
  - fast-uri@4.1.5
  - brace-expansion@5.0.12
  - brace-expansion@5.0.11
  - brace-expansion@5.0.10
  - source-map-js@1.2.2
  - '@vitest/mocker@4.1.12'
  - fast-uri@4.2.3
  - postcss-selector-parser@6.1.5
  - minimatch@11.0.1
overrides:
  ws: '>=8.21.0'
  form-data: '>=4.0.6'
  js-yaml: '>=5.3.0'
  '@babel/core': '^7.29.7'
  esbuild: '>=0.28.1'
  brace-expansion: '>=5.0.9'
  minimatch: '>=9'
  # jsx-a11y still requires minimatch 3 (CommonJS default export); v9+ crashes it.
  # Dev-only lint dependency, so pin it back for that package alone.
  'eslint-plugin-jsx-a11y>minimatch': '^3.1.2'
  fast-uri: '>=4.1.4'
